include:
  - docker-compose.sonarqube.yml

services:
  traefik:
    image: traefik:v3.3
    container_name: gamquiz-traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=gamquiz"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - gamquiz

  postgres:
    image: postgres:16-alpine
    container_name: gamquiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gamquiz}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamquiz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-gamquiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gamquiz-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - gamquiz
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamquiz-backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-gamquiz}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-htl-kahoot}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-htl-kahoot-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-htl-kahoot-secret}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?SEAWEEDFS_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?SEAWEEDFS_SECRET_KEY is required}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-media}
      AWS_ENDPOINT: http://seaweedfs-filer:8333
      AWS_URL: /media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    volumes:
      - backend_storage:/var/www/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - gamquiz

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamquiz-reverb
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-gamquiz}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-htl-kahoot}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-htl-kahoot-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-htl-kahoot-secret}
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    volumes:
      - backend_storage:/var/www/backend/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gamquiz

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamquiz-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-htl-kahoot-key}
    depends_on:
      - backend
    networks:
      - gamquiz

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: gamquiz-seaweedfs-master
    restart: unless-stopped
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -defaultReplication=000"
    volumes:
      - seaweedfs_master:/data
    networks:
      - gamquiz
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: gamquiz-seaweedfs-volume
    restart: unless-stopped
    command: "volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080 -max=50"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - seaweedfs_volume:/data
    networks:
      - gamquiz

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: gamquiz-seaweedfs-filer
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/seaweedfs/filer-entrypoint.sh"]
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?SEAWEEDFS_ACCESS_KEY is required}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?SEAWEEDFS_SECRET_KEY is required}
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - seaweedfs_filer:/data
      - ./seaweedfs/s3.json.tpl:/etc/seaweedfs/s3.json.tpl:ro
      - ./seaweedfs/filer-entrypoint.sh:/etc/seaweedfs/filer-entrypoint.sh:ro
    networks:
      - gamquiz

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamquiz-worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work redis --sleep=3 --tries=2 --timeout=120 --queue=default
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-gamquiz}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    volumes:
      - backend_storage:/var/www/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - gamquiz

  ollama:
    image: ollama/ollama:latest
    container_name: gamquiz-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gamquiz
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: gamquiz-ollama-pull
    restart: "no"
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - gamquiz

  nginx:
    image: nginx:1.27-alpine
    container_name: gamquiz-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - backend_storage:/var/www/backend/storage:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
      - reverb
      - seaweedfs-filer
    networks:
      - gamquiz
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  gamquiz:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  traefik_certs:
  nginx_logs:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
  ollama_data:
