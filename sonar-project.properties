# ─── Project identity ─────────────────────────────────────────────────────────
sonar.projectKey=htl-kahoot
sonar.projectName=HTL Kahoot
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ─── What to analyse ──────────────────────────────────────────────────────────
# Backend (Laravel / PHP) + Frontend (Next.js / TypeScript)
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Everything that should NOT count toward duplication / smells / coverage.
# Tailwind v4 entrypoints use non-standard at-rules (@theme, @custom-variant,
# @apply, ...) that Sonar's CSS analyzer doesn't understand, so exclude
# handwritten stylesheets under the frontend tree from analysis.
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/.next/**,\
    **/storage/**,\
    **/bootstrap/cache/**,\
    **/public/build/**,\
    **/public/storage/**,\
    **/docs/**,\
    **/*.min.js,\
    **/*.min.css,\
    frontend/src/**/*.css,\
    frontend/next-env.d.ts,\
    frontend/tsconfig.tsbuildinfo,\
    backend/database/migrations/**

sonar.test.exclusions=\
    **/vendor/**,\
    **/node_modules/**

# Keep generated / migration-ish files out of coverage metrics entirely.
sonar.coverage.exclusions=\
    backend/database/**,\
    backend/config/**,\
    backend/routes/**,\
    backend/bootstrap/**,\
    backend/app/OpenApi/**,\
    backend/app/Providers/**,\
    backend/tests/**,\
    frontend/src/**/*.d.ts,\
    frontend/src/**/layout.tsx,\
    frontend/src/**/page.tsx

# ─── PHP ──────────────────────────────────────────────────────────────────────
sonar.php.coverage.reportPaths=backend/storage/app/coverage/clover.xml
sonar.php.tests.reportPath=backend/storage/app/coverage/junit.xml

# ─── TypeScript / JavaScript ──────────────────────────────────────────────────
sonar.typescript.tsconfigPath=frontend/tsconfig.json
# When frontend unit tests land, point this at the lcov report:
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ─── Duplication tuning ───────────────────────────────────────────────────────
sonar.cpd.exclusions=\
    backend/database/seeders/**,\
    backend/app/Http/Resources/**,\
    backend/app/OpenApi/**
